name: Mirror
options:
  minimumXcodeGenVersion: 2.45.0
  bundleIdPrefix: com.x0c
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    PRODUCT_NAME: Mirror

targets:
  Mirror:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: MirrorApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.x0c.mirror
        INFOPLIST_FILE: MirrorApp/Info.plist
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
    info:
      path: MirrorApp/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSUIElement: true
        NSCameraUsageDescription: 需要访问前置摄像头来显示镜子画面。
        NSHumanReadableCopyright: "Copyright © 2026 x0c"
